version: "3.8"
services:
  db:
    image: postgres:16.2
    restart: always
    environment:
      POSTGRES_USER: g4mr
      POSTGRES_PASSWORD: g4mr
      POSTGRES_DB: postgres
    volumes:
      - ./data/pgsql:/var/lib/postgresql/data
    ports:
      - 5432:5432
  redis:
    image: redis:alpine
    restart: always
    ports:
      - 6379:6379
    command: redis-server --save 60 1 --loglevel warning --requirepass g4mr
    volumes:
      - ./data/redis:/data
