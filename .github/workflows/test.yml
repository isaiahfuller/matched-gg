name: Test
on:
  pull_request:
    branches:
      - main
jobs:
  lint:
    strategy:
      matrix:
        dir: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Enable yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run test
        run: |
          cd ${{matrix.dir}}
          yarn test
