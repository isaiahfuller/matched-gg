name: Lint
on:
  pull_request:
    branches:
      - main
jobs:
  lint:
    strategy:
      matrix:
        dir: [frontend, backend, landing]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 21

      - name: Enable yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Run lint
        run: yarn lint
