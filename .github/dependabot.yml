version: 2
updates:
  - package-ecosystem: "npm"
    directory: "landing/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
        update-types:
          - minor
          - patch
      development:
        dependency-type: "development"
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
  - package-ecosystem: "npm"
    directory: "frontend/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
        update-types:
          - minor
          - patch
      development:
        dependency-type: "development"
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
  - package-ecosystem: "npm"
    directory: "backend/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
        update-types:
          - minor
          - patch
      development:
        dependency-type: "development"
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
