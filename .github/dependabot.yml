version: 2
updates:
  - package-ecosystem: "npm"
    directory: "landing/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  - package-ecosystem: "npm"
    directory: "frontend/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  - package-ecosystem: "npm"
    directory: "backend/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
